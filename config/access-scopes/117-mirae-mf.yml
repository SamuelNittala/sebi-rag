apiVersion: mf-rag/v1
kind: AccessScope
metadata:
  key: mirae-mf
  externalCode: "117"
ownership:
  visibilityScope: TENANT
  tenantId: "117"
classification:
  knowledgeDomain: mutual_fund
  sourceCollection: mirae_mf
  amcSlug: mirae-asset
sources:
  - key: mirae-mf-sebi-sids
    connector: website_pdf
    enabled: true
    discovery:
      # SEBI's internal mutual-fund identifier is independent of tenant code 117.
      strategy: sebi_sid_scraper
      mfId: "37"
      maxSchemes: 107
      maxDocuments: 107
      minimumDocuments: 50
    schedule:
      enabled: true
      cron: "0 4 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.sebi.gov.in
      allowedPathPrefixes:
        - /sebi_data/
        - /sebiweb/
        - /web/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based

  - key: mirae-mf-2026-addenda
    connector: website_pdf
    enabled: true
    discovery:
      strategy: mirae_mf_download_catalog
      catalogUrl: https://www.miraeassetmf.co.in/AjaxService/GetDownloadsData
      moduleName: Addendum
      fromDate: "2026-01-01"
      toDate: "2026-12-31"
      pageSize: 100
      maxPages: 5
      maxDocuments: 100
      minimumDocuments: 60
    schedule:
      enabled: true
      cron: "0 3 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.miraeassetmf.co.in
      allowedPathPrefixes:
        - /AjaxService/GetDownloadsData
        - /docs/default-source/addendum-2019/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based

  - key: mirae-mf-2026-factsheets
    connector: website_pdf
    enabled: true
    discovery:
      strategy: mirae_mf_download_catalog
      catalogUrl: https://www.miraeassetmf.co.in/AjaxService/GetDownloadsData
      moduleName: Factsheet
      fromDate: "2026-01-01"
      toDate: "2026-12-31"
      pageSize: 100
      maxPages: 5
      maxDocuments: 100
      minimumDocuments: 12
    schedule:
      enabled: true
      cron: "15 3 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.miraeassetmf.co.in
      allowedPathPrefixes:
        - /AjaxService/GetDownloadsData
        - /docs/default-source/fachsheet/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based
    # Fund-name prefixes for the Docling side-by-side fund table split (T18k). Inert while
    # the parser is unpdf; T20 flips the parser to docling.
    parse:
      parser: unpdf
      fundNamePrefixes:
        - Mirae Asset
    # Factsheets cite "notice cum addendum no. ..." on many pages, which the
    # content heuristic would classify as Addendum; declare the type instead.
    documentType: Factsheet

  - key: mirae-mf-kims
    connector: website_pdf
    enabled: true
    discovery:
      strategy: mirae_mf_download_catalog
      catalogUrl: https://www.miraeassetmf.co.in/AjaxService/GetDownloadsData
      moduleName: Application_Form&KIM
      pageSize: 100
      maxPages: 5
      maxDocuments: 150
      minimumDocuments: 90
    schedule:
      enabled: true
      cron: "30 3 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.miraeassetmf.co.in
      allowedPathPrefixes:
        - /AjaxService/GetDownloadsData
        - /docs/default-source/application-form-kim/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based
