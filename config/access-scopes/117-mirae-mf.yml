apiVersion: mf-rag/v1
kind: AccessScope
metadata:
  key: mirae-mf
  externalCode: "117"
ownership:
  visibilityScope: TENANT
  tenantId: "117"
classification:
  knowledgeDomain: mutual_fund
  sourceCollection: mirae_mf
  amcSlug: mirae-asset
sources:
  - key: mirae-mf-public-pdfs
    connector: website_pdf
    enabled: false
    discovery:
      # Stable public factsheet landing root; individual dated PDF URLs are not pinned.
      strategy: constrained_crawl
      startUrls:
        - https://www.miraeassetmf.co.in/downloads/factsheet
      allowedPathPrefixes:
        - /downloads/factsheet
      maxDepth: 2
      maxPages: 100
      maxDocuments: 250
      identity:
        strategy: normalized_path
        queryParameters: []
    schedule:
      enabled: false
      cron: "0 3 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.miraeassetmf.co.in
      allowedPathPrefixes:
        - /
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based
