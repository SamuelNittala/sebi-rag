apiVersion: mf-rag/v1
kind: AccessScope
metadata:
  key: mirae-mf
  externalCode: "117"
ownership:
  visibilityScope: TENANT
  tenantId: "117"
classification:
  knowledgeDomain: mutual_fund
  sourceCollection: mirae_mf
  amcSlug: mirae-asset
sources:
  - key: mirae-mf-sebi-sids
    connector: website_pdf
    enabled: true
    discovery:
      # Discovers SID PDFs for Axis Mutual Fund from SEBI's scheme database.
      # externalCode 128 is MFCentral's AMC code; mfId 3 is SEBI's internal
      # fund identifier used in their URL structure — these are different ID systems.
      strategy: sebi_sid_scraper
      mfId: "37"
      maxSchemes: 100
      maxDocuments: 100
      # Axis had ~80 active schemes as of 2026-08-11; set conservatively.
      minimumDocuments: 50
    schedule:
      enabled: true
      cron: "0 4 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - www.sebi.gov.in
      allowedPathPrefixes:
        - /sebi_data/
        - /sebiweb/
        - /web/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based