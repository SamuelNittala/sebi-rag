apiVersion: mf-rag/v1
kind: AccessScope
metadata:
  key: mirae-sif
  externalCode: "910"
ownership:
  visibilityScope: TENANT
  tenantId: "910"
classification:
  knowledgeDomain: sif
  sourceCollection: mirae_sif
  amcSlug: mirae-asset
sources:
  - key: mirae-sif-public-pdfs
    connector: website_pdf
    enabled: false
    discovery:
      # The manifest pins the catalogue, never its current document URLs. Each
      # successful run enumerates every advertised section and subsection.
      strategy: mirae_sif_download_catalog
      catalogUrl: https://platinumsif.miraeassetmf.co.in/forms-downloads/forms
      sections: all
      # The site exposes TER through its API but omits it from sideLinks.
      # Keeping this target here makes that exception human-owned and reviewed.
      additionalTargets:
        - section: regulatory
          subsection: total-expense-ratio
          endpoint: ter
      pageSize: 100
      maxPages: 500
      maxDocuments: 5000
      # The reviewed 2026-08-04 baseline returned 46 PDFs.
      minimumDocuments: 40
    schedule:
      enabled: false
      cron: "0 2 * * *"
      timezone: Asia/Kolkata
    fetch:
      allowedHosts:
        - platinumsif.miraeassetmf.co.in
        - miraeassetetf.co.in
        # Official catalogue delivery host for the product-presentation PDF.
        - cms-dev.example.com
      allowedPathPrefixes:
        - /forms-downloads/forms
        - /api/sif-dynamic-get
        - /wp-content/uploads/
      maxBytes: 26214400
      timeoutMs: 30000
      maxRedirects: 3
    review:
      policy: risk_based
